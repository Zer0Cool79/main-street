<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Setting up an API key with your AI</title>
  <desc id="d">Four steps: ask your AI for help, get the key from the provider, paste it in Cloudflare environment variables, verify it on the staging site.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .box { fill: #faf6ef; stroke: #b4552d; stroke-width: 2.5; }
    .label { font-size: 15px; font-weight: 600; fill: #3d3129; text-anchor: middle; }
    .sub { font-size: 12px; fill: #8a7a5f; text-anchor: middle; }
    .dot { fill: #b4552d; }
  </style>

  <g>
    <circle cx="50" cy="110" r="38" class="box"/>
    <text x="50" y="105" class="label">1</text>
    <text x="50" y="150" class="label">Ask your AI</text>
    <text x="50" y="168" class="sub">paste the prompt</text>
  </g>
  <g>
    <circle cx="150" cy="110" r="38" class="box"/>
    <text x="150" y="105" class="label">2</text>
    <text x="150" y="150" class="label">Get the key</text>
    <text x="150" y="168" class="sub">from the provider</text>
  </g>
  <g>
    <circle cx="250" cy="110" r="38" class="box"/>
    <text x="250" y="105" class="label">3</text>
    <text x="250" y="150" class="label">Paste in Cloudflare</text>
    <text x="250" y="168" class="sub">Pages → environment variables</text>
  </g>
  <g>
    <circle cx="350" cy="110" r="38" class="box" style="stroke:#2e7d4f"/>
    <text x="350" y="105" class="label" style="fill:#2e7d4f">4</text>
    <text x="350" y="150" class="label">Verify</text>
    <text x="350" y="168" class="sub">on the staging site</text>
  </g>

  <path id="route" d="M88 110 H112 M188 110 H212 M288 110 H312" stroke="#b4552d" stroke-width="3" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
  <circle r="6" class="dot">
    <animateMotion dur="5s" repeatCount="indefinite" path="M88 110 H112 M188 110 H212 M288 110 H312"/>
  </circle>

  <rect x="60" y="205" width="280" height="52" rx="10" fill="#efe8d8"/>
  <text x="200" y="228" text-anchor="middle" font-size="14" fill="#3d3129">Never in the repo. Never in chat.</text>
  <text x="200" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#b4552d">If it leaks: delete it, make a new one.
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
