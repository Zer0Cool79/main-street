<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | {{business.name}}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">{{business.name}}</a>
    </div>
  </header>
  <main id="main">
    <div class="wrap not-found">
      <p class="eyebrow">404</p>
      <h1>That page went stale.</h1>
      <p class="lede">This address does not exist anymore (or never did). Let us get you back somewhere useful.</p>
      <p><a class="btn" href="/">Back to the homepage</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-base">
        <span>© {{year}} {{business.name}}. All rights reserved.</span>
        <span><a href="/privacy-policy/">Privacy</a> · <a href="/terms-of-service/">Terms</a></span>
      </div>
    </div>
  </footer>
</body>
</html>
